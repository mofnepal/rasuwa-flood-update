# रसुवा–भोटेकोशी बाढी अपडेट — reverse proxy.
#
# The portal lives at a subpath of the ministry's existing site, so on
# mof.gov.np the `location /rasuwa-flood/` block below is the only thing that
# needs adding to the ministry's server block. The rest of this file is the
# standalone server used by docker compose.

upstream rasuwa_web {
    server web:3000;
    keepalive 16;
}

# Rate limits: the portal is public and read-heavy, and the login form is the
# one place worth protecting from repeated attempts.
limit_req_zone $binary_remote_addr zone=rasuwa_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=rasuwa_login:10m   rate=1r/s;

# A minute of micro-caching in front of the public pages. A disaster portal can
# be linked from the news at any moment; this absorbs the spike without ever
# serving a figure more than a minute old. The admin area and the auth endpoints
# are never cached — see the location blocks below.
proxy_cache_path /var/cache/nginx/rasuwa levels=1:2 keys_zone=rasuwa_cache:16m
                 max_size=512m inactive=10m use_temp_path=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;
    charset utf-8;
    charset_types text/plain text/css application/json application/javascript text/xml;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = / {
        return 302 /rasuwa-flood/;
    }

    # ── the block to add to the ministry's own server config ────────────────
    location /rasuwa-flood/ {
        limit_req zone=rasuwa_general burst=60 nodelay;

        proxy_cache rasuwa_cache;
        proxy_cache_valid 200 301 302 60s;
        proxy_cache_valid 404 10s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        # Never serve one reader's admin session to another.
        proxy_cache_bypass $cookie_authjs_session_token $http_authorization;
        proxy_no_cache    $cookie_authjs_session_token $http_authorization;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_pass http://rasuwa_web/rasuwa-flood/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        proxy_read_timeout 180s;
    }

    # The login form is the one endpoint worth throttling harder.
    location /rasuwa-flood/api/auth/ {
        limit_req zone=rasuwa_login burst=10 nodelay;
        proxy_cache off;
        proxy_pass http://rasuwa_web/rasuwa-flood/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }

    # Immutable build assets.
    location /rasuwa-flood/_next/static/ {
        proxy_pass http://rasuwa_web/rasuwa-flood/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The admin area is never indexed.
    location /rasuwa-flood/admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        proxy_cache off;
        proxy_pass http://rasuwa_web/rasuwa-flood/admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
    }
}
